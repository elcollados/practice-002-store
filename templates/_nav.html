
<nav>
    {% if is_demo %}
        Demo account (read-only).
        Admin page: <a href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-user-shield"></i> {{ url_for('admin_dashboard') }}</a>
    {% endif %}

    {% if is_admin %}
        <a href="{{ url_for('admin_dashboard') }}" title="Admin"><i class="fa-solid fa-user-shield"></i> Admin</a>
    {% endif %}
    <a href="{{ url_for('home') }}"><i class="fa-solid fa-house"></i> Home</a>
    <a href="{{ url_for('live') }}"><i class="fa-solid fa-video"></i> Video</a>
    <a href="{{ url_for('cart') }}"><i class="fa-solid fa-cart-shopping"></i> Cart ({{ cart_count }})</a>
    <a href="{{ url_for('profile') }}"><i class="fa-solid fa-user"></i> Profile</a>
    {% if session.get('user_id') %}
        <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </form>
    {% endif %}
</nav>
