<!DOCTYPE html>
<html>
<head>
    <title>{{ product2.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    {% include "_flash.html" %}
    <header>
        <h1>Product Information</h1>
        {% include "_nav.html" %}
    </header>

    <main>
        <section class="products">
            <div class="product">
                <img src="{{ url_for('static', filename='image/' + product2.image) }}" alt="{{ product2.name }}">
                <p class="name">{{ product2.name }}</p>
                <p class="price">${{ product2.price }}</p>

                {% if product2.stock > 0 %}
                    <p class="stock">In stock: {{ product2.stock }}</p>
                {% else %}
                    <p class="stock out">Out of stock</p>
                {% endif %}

                <div class="actions">
                    <a class="btn btn-outline" href="{{ url_for('home') }}">Home</a>
                    {% if product2.stock > 0 %}
                    <form method="POST" action="{{ url_for('add_to_cart', product2_id=product2['id'] ) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn">Add to cart</button>
                    </form>
                    {% else %}
                        <span class="btn disabled">Out of stock</span>
                    {% endif %}
                </div>
            </div>
        </section>
    </main>
</body>
</html>
