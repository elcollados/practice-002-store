<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
   
    {% include "_flash.html" %}
    <header>
        <h1>Order Received</h1>
        <h2>Order #{{ order_id }}</h2>
        <nav>
            <a href="{{ url_for('profile') }}"><i class="fa-solid fa-user"></i> Profile</a>
        {% if session.get('user_id') %}
            <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </form>
        {% endif %}
        </nav>
    </header>

    <main>
        <h2>Thank You, {{ name }}!</h2>
        <p>Shipped to: {{ address }}</p>

        <section class="products">
            <div class="product">
                {% include "_order_items.html" with context %}
            </div>
        </section>

        <p class="price">Total: ${{ order2.total|money }}</p>
        <a class="btn" href="{{ url_for('home') }}">Continue shopping</a>
    </main>
</body>
</html>
