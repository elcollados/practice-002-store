<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    {% include "_flash.html" %}
    <header>
        <h1>Search Results</h1>
        <form action="{{ url_for('search') }}" method="GET" class="search-form">
            <input class="search" type="search" name="search" placeholder="Search products" aria-label="Search products" required>
            <button type="submit" aria-label="Search" class="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
        {% include "_nav.html" %}
    </header>

    <main>
        <h2>Results for "{{ query }}"</h2>
        {% if results %}
        <section class="products">
            {% for product2 in results %}
            <div class="product">
                <a class="name" href="{{ url_for('product_detail', product2_id=product2.id) }}">{{ product2.name }}</a>
                <p class="price">${{ product2.price|money }}</p>

                <a class="btn" href="{{ url_for('product_detail', product2_id=product2.id) }}">View</a>
            </div>
            {% endfor %}
        </section>
        {% else %}
            <h2>No products found.</h2>
        {% endif %}
    </main>
</body>
</html>
