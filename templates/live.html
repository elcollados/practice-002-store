<!DOCTYPE html>
<html>
<head>
    <title>Videos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    {% include "_flash.html" %}
    <header>
        <h1>Videos</h1>
        <form action="{{ url_for('search') }}" method="GET" class="search-form">
            <input class="search" type="search" name="search" placeholder="Search products..." aria-label="Search products" required>
            <button type="submit" aria-label="Search" class="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
        {% include "_nav.html" %}
    </header>

    <main>
        <div class="video-card">
            <video width="500" controls autoplay muted loop>
                <source src="{{ url_for('static', filename='video/green.mp4') }}" type="video/mp4">
            </video>
            <br><br>
            <a class="btn" href="{{ url_for('product_detail', product2_id=1) }}">View Product</a>
        </div>
    </main>
</body>
</html>
