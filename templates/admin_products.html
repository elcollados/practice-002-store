<!DOCTYPE html>
<html>
<head>
    <title>All Orders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Products</h1>
        <nav>
            <a href="{{ url_for('admin_dashboard') }}" title="Admin"><i class="fa-solid fa-user-shield"></i> Admin </a>
            <a href="{{ url_for('admin_orders') }}"><i class="fa-solid fa-receipt"></i> All Orders</a>
        {% if session.get('user_id') %}
            <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </form>
        {% endif %}
        </nav>
    </header>
    {% include "_flash.html" %}
    <main>  
        <h2>Add product</h2>
        <form method="post" enctype="multipart/form-data" action="{{ url_for('admin_add_product') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="name" placeholder="Name" required>
            <input type="number" name="price" placeholder="Price" step="0.01" min="0" required>
            <input type="number" name="stock" placeholder="Stock" min="0" required>
            <input type="file" name="image_file" accept="image/*" required>
            <button type="submit" class="btn">Add product</button>
        </form>

        <h2>Edit products</h2>
        {% for product in products %}
            <form method="post" enctype="multipart/form-data" action="{{ url_for('admin_edit_product', product_id=product['id']) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="name" value="{{ product['name'] }}" required>
                <input type="number" name="price" value="{{ '%.2f'|format(product['price'] / 100) }}" step="0.01" min="0" required>
                <input type="number" name="stock" value="{{ product['stock'] }}" min="0" required>
                <input type="text" name="image" value="{{ product['image'] }}" required>
                <input type="file" name="image_file" accept="image/*">
                <button type="submit" class="btn">Save</button>
            </form>

            <form method="post" action="{{ url_for('admin_delete_product', product_id=product['id']) }}"
                onsubmit="return confirm('Delete this product?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="delbtn">Delete</button>
            </form>
        {% endfor %}
    </main>
</body>
</html>
